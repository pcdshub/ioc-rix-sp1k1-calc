[workspace]
authors = ["SLAC National Accelerator Laboratory"]
channels = ["conda-forge"]
name = "ioc-rix-sp1k1-calc"
platforms = ["linux-64"]
# Avoid supply chain risk while using pixi commands
exclude-newer = "7d"

[tasks]
test = "./pixi_tasks/test.sh"
docs = "cd docs && make html"
lint = "pre-commit run --all-files"

[dependencies]
python = ">=3.14.6,<3.15"

[pypi-dependencies]
ioc-rix-sp1k1-calc = { path = ".", editable = true }
